<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Розбивка рядка</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    textarea { width: 100%; height: 100px; }
    pre { background-color: #f0f0f0; padding: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>

<h2>Розбивка рядка на кілька рядків (після кожних 3 слів)</h2>

<textarea id="inputText" placeholder="Введіть текст тут..."></textarea><br><br>
<button onclick="processText()">Обробити</button>

<h3>Результат:</h3>
<pre id="outputText"></pre>

<script>
  function strikeStr(str) {
    const words = str.trim().split(/\s+/);
    if (words.length <= 3) return str;

    let result = '';
    for (let i = 0; i < words.length; i++) {
      result += words[i] + ' ';
      if ((i + 1) % 3 === 0 && i !== words.length - 1) {
        result += '\n';
      }
    }
    return result.trim();
  }

  function processText() {
    const input = document.getElementById("inputText").value;
    const output = strikeStr(input);
    document.getElementById("outputText").textContent = output;
  }
</script>

</body>
</html>
